services:
  - type: web
    name: tasktrack-api
    runtime: docker
    plan: free
    dockerfilePath: ./TaskTrack.API/Dockerfile
    dockerContext: .
    healthCheckPath: /api/summary
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: tasktrack-db
          property: connectionString
      - key: FrontendUrl
        value: https://asm-1-tasktrack-fe.vercel.app

databases:
  - name: tasktrack-db
    databaseName: tasktrackdb
    user: tasktrack
    plan: free
